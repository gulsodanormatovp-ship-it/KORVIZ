<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>KORVIZ — Cloud & Deploy Platform</title>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; margin: 0; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; padding-bottom: 15px; }
        .logo { font-size: 24px; font-weight: bold; color: #58a6ff; letter-spacing: 2px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; }
        h2 { color: #f0f6fc; margin-top: 0; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background: #238636; color: #fff; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2ea043; }
        .repo-item { background: #21262d; padding: 10px; margin-bottom: 8px; border-radius: 6px; border-left: 4px solid #58a6ff; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">⚡ KORVIZ PLATFORM</div>
        <div>GitHub & Render Hybrid Cloud</div>
    </div>

    <div class="grid">
        <!-- GitHub Muqobili: Repozitoriya saqlash -->
        <div class="card">
            <h2>📦 Repozitoriya Yaratish (GitHub)</h2>
            <input type="text" id="repoName" placeholder="Loyiha nomi...">
            <textarea id="repoDesc" placeholder="Loyiha tavsifi..."></textarea>
            <button onclick="createRepo()">KORVIZ'ga Saqlash</button>

            <h3>Saqlangan Loyihalar:</h3>
            <div id="repoList">Yuklanmoqda...</div>
        </div>

        <!-- Render Muqobili: Deploy qilish -->
        <div class="card">
            <h2>🚀 Serverga Deploy Qilish (Render)</h2>
            <input type="text" id="deployName" placeholder="Xizmat nomi (masalan: my-bot)">
            <input type="text" id="gitUrl" placeholder="Git Repozitoriya URL-havolasi">
            <button onclick="deployApp()" style="background: #1f6feb;">Deploy qilish (24/7 Run)</button>

            <h3>Ishlayotgan Servislar:</h3>
            <div id="deployList">Yuklanmoqda...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            const repoRes = await fetch('/api/repos');
            const repos = await repoRes.json();
            document.getElementById('repoList').innerHTML = repos.map(r => 
                `<div class="repo-item"><b>${r.name}</b><br><small>${r.description}</small></div>`
            ).join('') || 'Hozircha saqlangan loyiha yo\'q';

            const deployRes = await fetch('/api/deployments');
            const deploys = await deployRes.json();
            document.getElementById('deployList').innerHTML = Object.keys(deploys).map(k => 
                `<div class="repo-item" style="border-color:#2ea043"><b>${k}</b> - Status: ${deploys[k].status} (PID: ${deploys[k].pid})</div>`
            ).join('') || 'Hozircha faol deploylar yo\'q';
        }

        async function createRepo() {
            const name = document.getElementById('repoName').value;
            const description = document.getElementById('repoDesc').value;
            await fetch('/api/repos/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });
            loadData();
        }

        async function deployApp() {
            const name = document.getElementById('deployName').value;
            const gitUrl = document.getElementById('gitUrl').value;
            await fetch('/api/deploy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, gitUrl })
            });
            loadData();
        }

        loadData();
    </script>
</body>
</html>
