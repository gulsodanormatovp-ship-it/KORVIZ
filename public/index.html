<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>KORVIZ Engine</title>
    <style>
        body { background-color: #0b0f19; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 24px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 20px; }
        .logo { font-size: 26px; font-weight: 800; color: #38bdf8; letter-spacing: 2px; }
        .subtitle { font-size: 14px; color: #64748b; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-top: 24px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; }
        h2 { color: #f8fafc; margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #030712; border: 1px solid #374151; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus, textarea:focus { border-color: #38bdf8; }
        button { background: #0284c7; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; margin-top: 8px; transition: 0.2s; }
        button:hover { background: #0369a1; }
        .repo-item { background: #1f2937; padding: 12px 16px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid #38bdf8; }
        .status-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #065f46; color: #34d399; }
    </style>
</head>
<body>

    <div class="header">
        <div>
            <div class="logo">⚡ KORVIZ PLATFORM</div>
            <div class="subtitle">Cloud Infrastructure & Automated Hosting Engine</div>
        </div>
    </div>

    <div class="grid">
        <div class="card">
            <h2>📦 Kod Ombori (Repositories)</h2>
            <input type="text" id="repoName" placeholder="Loyiha nomi...">
            <textarea id="repoDesc" placeholder="Loyiha tavsifi va xususiyatlari..."></textarea>
            <button onclick="createRepo()">KORVIZ Omboriga Saqlash</button>

            <h3 style="font-size:15px; margin-top:24px; color:#94a3b8;">Mavjud Loyihalar:</h3>
            <div id="repoList">Yuklanmoqda...</div>
        </div>

        <div class="card">
            <h2>🚀 Bulutli Host (Cloud Server)</h2>
            <input type="text" id="deployName" placeholder="Servis nomi (masalan: my-bot)">
            <input type="text" id="gitUrl" placeholder="Git Repository URL">
            <button onclick="deployApp()" style="background: #10b981;">Serverda Ishga Tushirish</button>

            <h3 style="font-size:15px; margin-top:24px; color:#94a3b8;">Faol Serverlar:</h3>
            <div id="deployList">Yuklanmoqda...</div>
        </div>
    </div>

    <script>
        async function loadData() {
            try {
                const repoRes = await fetch('/api/repos');
                const repos = await repoRes.json();
                document.getElementById('repoList').innerHTML = repos.map(r => 
                    `<div class="repo-item"><b>${r.name}</b><br><small style="color:#94a3b8">${r.description}</small></div>`
                ).join('') || '<div style="color:#64748b; font-size:14px;">Hozircha saqlangan loyiha yo\'q</div>';

                const deployRes = await fetch('/api/deployments');
                const deploys = await deployRes.json();
                document.getElementById('deployList').innerHTML = Object.keys(deploys).map(k => 
                    `<div class="repo-item" style="border-color:#10b981">
                        <b>${k}</b> <span class="status-badge">${deploys[k].status}</span>
                        <div style="font-size:12px; color:#94a3b8; margin-top:4px;">URL: ${deploys[k].gitUrl}</div>
                     </div>`
                ).join('') || '<div style="color:#64748b; font-size:14px;">Hozircha faol serverlar yo\'q</div>';
            } catch (e) {
                console.error("Xatolik:", e);
            }
        }

        async function createRepo() {
            const name = document.getElementById('repoName').value;
            const description = document.getElementById('repoDesc').value;
            if(!name) return alert("Nomini kiriting!");
            await fetch('/api/repos/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, description })
            });
            document.getElementById('repoName').value = '';
            document.getElementById('repoDesc').value = '';
            loadData();
        }

        async function deployApp() {
            const name = document.getElementById('deployName').value;
            const gitUrl = document.getElementById('gitUrl').value;
            if(!gitUrl) return alert("Git URL kiriting!");
            await fetch('/api/deploy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, gitUrl })
            });
            document.getElementById('deployName').value = '';
            document.getElementById('gitUrl').value = '';
            loadData();
        }

        loadData();
    </script>
</body>
</html>
